server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Hashed assets are immutable; the service worker and manifest must not be
  # cached or a deploy would never reach a returning user.
  location ~* \.(js|css|woff2|png|jpg|jpeg|svg)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }
  location = /manifest.webmanifest {
    add_header Cache-Control "no-cache";
  }

  # Client-side routing: unknown paths render the app, not a 404.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
